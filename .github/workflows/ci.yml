name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: python -m pip install --upgrade build pytest

      - name: Compile Python
        run: python -m compileall -q processedge_posnext_override

      - name: Validate release metadata
        run: python -m pytest -q processedge_posnext_override/tests/test_release_metadata.py

      - name: Build Python package
        run: python -m build
